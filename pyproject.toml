[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timewarp"
version = "0.1.0"
description = "Forensic reconstruction of lost AI coding project states"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rishaan Desai" }]
dependencies = [
  "pathspec>=0.12,<1",
  "tqdm>=4.66,<5",
]

[project.scripts]
timewarp = "timewarp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/timewarp/skills/timewarp" = ["skills/timewarp/SKILL.md"]
"share/timewarp/skills/timewarp/agents" = ["skills/timewarp/agents/openai.yaml"]
